name: maeum_book
description: "경조사 기록 앱 마음장부"
publish_to: 'none'

version: 1.2.6+11

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  go_router: ^18.1.4
  flutter_slidable: ^5.2.0
  fl_chart: ^1.3.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  http: ^1.6.0
  supabase_flutter: ^2.18.3
  kakao_flutter_sdk_user: ^2.1.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  flutter_svg: ^2.5.1
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  archive: ^4.7.1
  share_plus: ^13.3.1
  file_picker: ^13.4.1
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  image: ^4.13.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: ^2.4.8
  xml: ^7.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_icon_foreground.png
    # 로그인 버튼 공식 심볼: 카카오(디자인 리소스 SVG), Apple(appleid.cdn-apple.com 공식 버튼 이미지 서비스, 1x/2x/3x)
    - assets/images/
    # 개인정보 처리방침: 앱 안에서도 보여 준다 (인터넷 없이도). 원본은 문서 하나로 관리
    - docs/PRIVACY_POLICY.md
    # 글꼴 라이선스 전문: 설정 › 오픈소스 라이선스에 보여 준다 (배포할 때 함께 넣어야 하는 조건)
    - assets/fonts/OFL-Pretendard.txt
    - assets/fonts/OFL-GowunBatang.txt

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    - family: GowunBatang
      fonts:
        - asset: assets/fonts/GowunBatang-Regular.ttf
        - asset: assets/fonts/GowunBatang-Bold.ttf
          weight: 700

# 스플래시(앱을 켤 때 첫 화면). 설정을 바꾸면 아래 명령으로 iOS·Android 파일을 다시 만든다.
#   fvm dart run flutter_native_splash:create
flutter_native_splash:
  color: "#C0714A"
  image: assets/icon/app_icon_foreground.png
  android_12:
    color: "#C0714A"
    image: assets/icon/app_icon_foreground.png
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#C0714A"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FBF7F2"
    theme_color: "#C0714A"
