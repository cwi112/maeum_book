# Codemagic: Mac 없이 iOS · Android 앱을 빌드해 TestFlight · 스토어에 올린다.
# 배포 흐름 전체는 docs/DEPLOY.md, 스토어 첫 출시 준비는 docs/STORE_RELEASE.md 참고.
#
# | 워크플로 | 언제 | 하는 일 |
# |---|---|---|
# | ios-testflight | v* 태그 push (scripts/release.ps1) | 테스트 → IPA → TestFlight 업로드 |
# | ios-appstore   | store-v* · store-ios-v* 태그 push (scripts/submit-store.ps1) | 테스트 → IPA → App Store 심사 제출. 출시 버튼은 사람이 |
# | android-play   | store-v* · store-android-v* 태그 push (scripts/submit-store.ps1) | 테스트 → AAB → Google Play 내부 테스트 초안 |
#
# 빌드는 태그 push로 자동 시작한다. (GitHub이 태그 소식을 Codemagic에 알려 줌 = 웹훅)
# 스크립트는 토큰으로 그 빌드를 찾아 끝날 때까지 지켜보고 성공 · 실패를 터미널에 알려 준다.
# (v* 패턴은 v로 "시작하는" 태그만 잡으므로 store-v1.2.1에는 ios-testflight가 돌지 않는다)
#
# 사전 준비 (Codemagic 웹에서 한 번만):
#   - App Store Connect API 키: Settings → Integrations → Developer Portal, 이름 maeum_book_asc
#   - iOS 서명: Code signing identities에 App Store 인증서 · 프로파일 (docs/DEPLOY.md)
#   - Android 서명: Code signing identities → Android keystores에 업로드 키, 이름 maeum_book_upload
#   - Google Play: Environment variables → 그룹 google_play 에 GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (서비스 계정 JSON)

definitions:
  ios_environment: &ios_environment
    ios_signing:
      distribution_type: app_store
      bundle_identifier: com.maeumbook.maeumBook
    # (선택) 빌드 번호를 App Store Connect 최신 번호 + 1로 맞추려면 아래 두 줄의 #을 지우고 Apple ID 숫자를 넣는다.
    #   App Store Connect → 앱 → 앱 정보 → "Apple ID". 없으면 빌드 번호는 pubspec 값을 쓴다.
    #   ⚠️ 값을 빈칸("")으로 두면 Codemagic이 설정 파일 전체를 거부한다. (1.2.2 빌드 실패 원인)
    # vars:
    #   APP_STORE_APPLE_ID: 1234567890
    flutter: stable
    xcode: latest
    cocoapods: default

  ios_build_scripts: &ios_build_scripts
    - name: 패키지 설치
      script: flutter pub get
    - name: 테스트
      script: flutter test
    - name: Xcode 프로젝트에 서명 프로파일 적용
      script: xcode-project use-profiles
    - name: 빌드 번호 정하기
      # pubspec 번호와 "이미 올라간 번호 + 1" 중 큰 값 → TestFlight · 스토어 제출이 번호로 겹치지 않는다.
      script: |
        BUILD_NUMBER=$(bash scripts/ci/next_build_number.sh ios)
        echo "빌드 번호: $BUILD_NUMBER"
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
    - name: IPA 빌드
      # 버전 이름은 pubspec.yaml의 version(예: 1.2.1+6)의 앞부분을 그대로 쓴다.
      script: |
        flutter build ipa --release \
          --build-number=$BUILD_NUMBER \
          --export-options-plist=/Users/builder/export_options.plist
    - name: 아이폰 오류 기호 파일 올리기 (파이어베이스 Crashlytics)
      # 기호 파일(dSYM): 앱이 멈췄을 때의 위치(암호 같은 주소)를 "어느 파일 몇째 줄"로 풀어 주는 파일.
      # 빌드할 때마다 만들어지므로 그 빌드의 것을 파이어베이스에 올려 둔다.
      # 올리는 도구(upload-symbols)는 파이어베이스 패키지 안에 들어 있다. 빌드 방식마다 위치가 달라서 넓게 찾고,
      # 그래도 없으면 파이어베이스 공식 저장소에서 같은 도구를 받아 쓴다. (1.2.8 빌드에서 못 찾고 건너뛰었음)
      # 이 단계가 실패해도 배포는 막지 않는다. (오류 위치만 덜 정확해질 뿐)
      script: |
        #!/usr/bin/env bash
        UPLOAD=$(find "$CM_BUILD_DIR" "$HOME/Library/Developer/Xcode/DerivedData" "$HOME/Library/Caches/org.swift.swiftpm" \
          -name upload-symbols \( -type f -o -type l \) -path "*Crashlytics*" 2>/dev/null | head -n 1)
        if [ -z "$UPLOAD" ]; then
          echo "패키지 안에서 도구를 못 찾아 공식 저장소에서 받습니다."
          UPLOAD="$HOME/upload-symbols"
          curl -fsSL -o "$UPLOAD" \
            "https://raw.githubusercontent.com/firebase/firebase-ios-sdk/main/Crashlytics/upload-symbols" \
            && chmod +x "$UPLOAD" || { echo "도구를 받지 못해 건너뜁니다."; exit 0; }
        fi
        echo "도구: $UPLOAD"
        echo "찾은 기호 파일: $(find "$CM_BUILD_DIR/build/ios/archive" -name "*.dSYM" -type d 2>/dev/null | wc -l | tr -d ' ')개"
        COUNT=0
        while IFS= read -r DSYM; do
          echo "올리는 중: $(basename "$DSYM")"
          if "$UPLOAD" -gsp "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist" -p ios "$DSYM"; then
            COUNT=$((COUNT + 1))
          else
            echo "올리기 실패: $DSYM"
          fi
        done < <(find "$CM_BUILD_DIR/build/ios/archive" -name "*.dSYM" -type d 2>/dev/null)
        echo "기호 파일 $COUNT개 올림"

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # v로 시작하는 태그(v1.2.3 등)가 push되면 자동 실행. (scripts/release.ps1) Codemagic 화면에서 수동 실행도 가능.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    integrations:
      app_store_connect: maeum_book_asc

    environment: *ios_environment
    scripts: *ios_build_scripts

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # false: App Store Connect에 업로드만 한다 → 내부 테스터는 TestFlight에서 바로 받을 수 있다.
        # 외부 테스터에게 배포하려면 true로 바꾼다. 그 전에 App Store Connect → TestFlight → 테스트 정보
        # (피드백 이메일, 심사 담당자 이름·전화·이메일)를 채워야 하며, 비어 있으면 빌드가 post-processing 실패로 끝난다.
        submit_to_testflight: false

  ios-appstore:
    name: iOS App Store 심사 제출
    max_build_duration: 60
    instance_type: mac_mini_m2

    # store-v1.2.3(iOS · Android 함께) 또는 store-ios-v1.2.3 태그가 push되면 자동 실행. (scripts/submit-store.ps1)
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'store-v*'
          include: true
        - pattern: 'store-ios-v*'
          include: true

    integrations:
      app_store_connect: maeum_book_asc

    environment: *ios_environment
    scripts: *ios_build_scripts

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        # 빌드를 올린 뒤 App Store 심사에 제출한다. 이번 버전의 새로운 기능 = release_notes.json
        # ⚠️ 처음 한 번은 App Store Connect에서 앱 정보 · 스크린샷 · 개인정보 등을 직접 채워야 제출된다. (docs/STORE_RELEASE.md)
        submit_to_app_store: true
        # 심사를 통과해도 바로 출시하지 않는다. App Store Connect에서 "이 버전 출시"를 눌러야 사용자에게 나간다.
        release_type: MANUAL

  android-play:
    name: Android Google Play (내부 테스트)
    max_build_duration: 60
    instance_type: linux_x2

    # store-v1.2.3(iOS · Android 함께) 또는 store-android-v1.2.3 태그가 push되면 자동 실행. (scripts/submit-store.ps1)
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'store-v*'
          include: true
        - pattern: 'store-android-v*'
          include: true


    environment:
      android_signing:
        - maeum_book_upload
      groups:
        - google_play
      vars:
        PACKAGE_NAME: com.maeumbook.maeum_book
      flutter: stable

    scripts:
      - name: 패키지 설치
        script: flutter pub get
      - name: 테스트
        script: flutter test
      - name: 빌드 번호 정하기
        script: |
          BUILD_NUMBER=$(bash scripts/ci/next_build_number.sh android)
          echo "빌드 번호: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: AAB 빌드 (서명)
        script: flutter build appbundle --release --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # 내부 테스트 트랙에 "초안"으로 올린다. Play Console에서 검토 후 프로덕션으로 승격 · 출시한다.
        track: internal
        submit_as_draft: true
